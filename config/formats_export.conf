# formats_export.conf -- THE single DEFAULT owner of the "formats export" switch (operator order 2026-10-26).
#
# Meaning: whether any exporter may turn a Markdown document into .html / .pdf / .docx siblings ("formats").
#   formats_export=false   (THE DEFAULT, and the value shipped here)
#       No exporter produces .html/.pdf/.docx from Markdown, and no parity gate demands or flags such siblings.
#       Only .md documents are docs. Every consumer announces its skip (never silent, section 11.4.106(E)).
#   formats_export=true
#       The legacy behaviour: exports are regenerated on commit and the sibling-parity seams enforce them
#       (section 11.4.65 / 11.4.74 / 11.4.141 M7).
#
# Who reads this file: ONLY constitution/scripts/formats_export_lib.sh (formats_export_enabled). Nothing else parses it.
#
# How a consuming repository turns the exports ON (all explicit, none implicit):
#   1. One run:        DOCS_EXPORT=1 <command>            (DOCS_EXPORT=0 forces off for one run)
#   2. Repository:     docs/context/doc_export.policy  containing a line  enabled=1
#                      (an explicit repository override; the file never needs to exist to stay OFF)
#   3. Everywhere:     change the value below to true     (a constitution-level decision, not a repo one)
#
# A missing file, a missing key or an unparsable value means false (fail-closed: when in doubt, produce nothing).
formats_export=false
