# config/delivery.conf — §11.4.297(A) pull-request delivery declaration of THIS repository
# (HelixDevelopment/constitution; GitHub repository HelixDevelopment/HelixConstitution).
#
# DATA per §11.4.35. Account names live ONLY in this file (§11.4.297(D)(1)); no rule text names one.
# Format: key=value, one per line, '#' starts a comment (the format read by
# scripts/gates/cm_pr_delivery_account_name_free.sh). List values are comma-separated.
#
# Recorded operator decision (§11.4.66): 2026-11-16, given through an interactive question to the
# conductor and relayed to the fixer agent; the operator's answer on the merger, as relayed:
#   "You do all PRs reviews and merging into main for main repo and all Submodules fully recursively"
# Reviewer accounts (as relayed): one GitHub account, which is also the account that opens the
# pull requests. See the note at pr_reviewers below: under §11.4.297(D)(2) that combination means
# no reviewer is possible, and the delivery ends non-zero until the operator changes it.
# Status: PROVISIONAL (§11.4.297(G)): this file is a declaration; no delivery tool reads it yet,
# and nothing here is ENFORCED.
#
# Recorded operator decisions of 2026-11-16, second round (relayed by the conductor; paraphrased
# here, not the operator's verbatim words), decision id OPD-2026-11-16-PR-DELIVERY-R2:
#   (1) every pull request is created, self-reviewed and merged by the agent and assigned to the main
#       repository owner's account (the account in pr_assignees below). The platform may refuse the
#       agent's own review or reviewer request; under §11.4.297(D) that refusal is REPORTED (never
#       dropped, never replaced by another account) and the delivery ends non-zero on that point.
#       CONSUMER DEPARTURE (recorded here, the anchor is NOT amended): the agent still merges when every
#       OTHER merge condition holds, citing this decision; see author_only_reviewer_policy below and the
#       follow-up question item filed for it (CON-425).
#   (2) merge window: none, merge as soon as every condition holds (merge_window_hours below).
#   (3) CON-424 gate fix: root-level default config and --changed-since exclusion of this file.
#   (4) keep the extra keys pr_repository, pr_assignees, decision_date, own_repositories.
#   (5) the open items are answered conservatively by the agent; what it could not decide is marked
#       UNCONFIRMED below and recorded as open questions in CON-423 / CON-425.

decision_id=OPD-2026-11-16-PR-DELIVERY
decision_date=2026-11-16
decision_id_round2=OPD-2026-11-16-PR-DELIVERY-R2

# Closed set: direct | pr
mode=pr
base=main

# The GitHub-only remote as derived by install_upstreams.sh (§11.4.111 naming; measured 2026-11-16
# in a scratch clone). NOT 'origin': origin is the multi-upstream fan-out remote, so a task-branch
# push through it would land the branch on every mirror and widen retirement (§11.4.297(C)(4)).
pr_remote=github_helixdevelopment
# Canonical GitHub name as the API reports it (measured 2026-11-16); the upstream URL
# git@github.com:HelixDevelopment/HelixConstitution.git redirects to it.
pr_repository=HelixDevelopment/constitution

# Branch name <prefix>/<id>-<slug>. 'task' is the prefix of the operator's own pull requests
# #7, #8 and #9 (task/ATM-2188-..., task/ATM-2190-...).
branch_prefix=task

# Reviewer list of this repository. As relayed: one account, the same account as the author.
# §11.4.297(D)(2): the author is skipped; when the author is the only listed account, no reviewer
# is possible and the delivery reports it and ends non-zero. This is the recorded state, not a fault
# of this file (decision (1) above).
# Closed set used by this repository only: report-and-merge | report-and-stop.
#   report-and-merge (decision (1)): the "no reviewer possible" and any platform refusal are reported
#   in the pull request and the delivery output, the delivery exit status stays non-zero, and the
#   agent still merges when every other merge condition holds, citing OPD-2026-11-16-PR-DELIVERY-R2.
#   Whether this departure from §11.4.297(C)/(D) is to be kept, or the anchor amended, or a second
#   account added, is open: follow-up question item CON-425.
author_only_reviewer_policy=report-and-merge
pr_reviewers=milos85vasic
pr_assignees=milos85vasic

# Closed set: ff-only | merge-commit. merge-commit = first parent the previous main tip, second
# parent the reviewed head (§11.4.297(A.3)); measured: PRs #7, #8 and #9 landed in this form.
landing_form=merge-commit

# Closed set: author-agent | human. Operator answer: the agent merges.
merger=author-agent

protected_branches=main

# Closed set: off | expected | enforced. 'off': no local guard is installed (none exists in this repo).
# Conservative answer (decision (5)): stays 'off'. 'expected' or 'enforced' would claim a guard that does
# not exist (§11.4.297(G)); installing one is a hook change that needs the operator's consent.
# UNCONFIRMED: whether a guard is wanted (open question in CON-423).
direct_push_guard=off

# Shared single files: pull requests that change one of these land one at a time (§11.4.297(B)(5)).
# Conservative answer (decision (5)): the list is widened to every single file that two pull requests
# commonly both change in this repository (the tracker and its rendered documents, the canon and its
# four mirrors, the index and generated rule catalogue, the gate deferral ledger, the README).
# A wider list only makes more pull requests land one at a time; it never lets two land together.
# UNCONFIRMED: whether the operator wants a narrower list (open question in CON-423).
# docs/requests/history.md does not exist in this repository (measured 2026-11-16); kept so a later
# request-history file is serial from its first commit.
shared_single_files=docs/CONTINUATION.md,docs/workable_items.db,docs/Issues.md,docs/Issues_Summary.md,docs/Fixed.md,docs/Fixed_Summary.md,CHANGELOG.md,README.md,docs/requests/history.md,Constitution.md,CLAUDE.md,AGENTS.md,QWEN.md,GEMINI.md,constitution_index.yaml,progressive/catalog.json,progressive/rules_manifest.json,scripts/gates/gate_ledger_deferrals.tsv

# Tool-written ledger paths (§11.4.297(E)(3)). Conservative answer (decision (5)): none declared, so
# no ledger row is accepted as generated-regeneration; every changed path must be in scope or carry one
# of the four §11.4.293 reasons. UNCONFIRMED candidates (open question in CON-423):
# docs/workable_items.db (written by scripts/workable-items) and the rendered docs/Issues*.md, docs/Fixed*.md.
tool_written_paths=

evidence_dir=docs/qa

# Merge window (§11.4.297(A.2)). Decision (2): none; the pull request is merged as soon as every merge
# condition holds, so no GO is ever left waiting for a window. The literal 'none' means no window.
merge_window_hours=none

# Per-PR source-correctness GO record (§11.4.297(C)). Conservative answer (decision (5)): the GO record of
# the independent review (§11.4.142 / §11.4.209) is posted as a pull-request comment naming the reviewed
# head sha, the review substrate and the verdict, and is read back before the merge; it is NOT committed
# into the task branch (a commit would move the reviewed head). UNCONFIRMED: whether a committed copy
# under docs/qa/<task-id>/ after landing is also wanted (open question in CON-423).
go_record_location=pr-comment

# §11.4.288 own repositories covered recursively (own-org list: vasic-digital, HelixDevelopment).
# Format per entry: <path>:<github org/repo>:<mode>. Third-party submodules are excluded
# (§11.4.288(A)): superspec, open_design, watch-skill, repo-qa, verify, claude-video,
# agentic-validation, verification, repo-proof, donespec, skill-doctor, verfix, MVT, wave-dpctf,
# mcp-audio-tweaker, polyscreen-mcp, video-quality-mcp.
# Each submodule's own reviewer list, upstreams and platform settings are NOT measured here
# (docs/qa/pr_delivery_decision_20261116/sub_*.txt read only the permissions and found no rulesets).
# Conservative answer (decision (5)): every row is 'pr' as relayed ("all Submodules fully recursively"),
# with this file's reviewer and assignee accounts, branch prefix, landing form and merger. UNCONFIRMED:
# each submodule's own upstream list and merge-method settings (open question in CON-423).
own_repositories=.:HelixDevelopment/HelixConstitution:pr,submodules/docs_chain:vasic-digital/docs_chain:pr,submodules/continuum:vasic-digital/continuum:pr,submodules/anti_bluff:vasic-digital/anti_bluff:pr,submodules/session_orchestrator:vasic-digital/session_orchestrator:pr,submodules/token_optimizer:vasic-digital/token_optimizer:pr,submodules/helix_perf_cache:HelixDevelopment/helix_perf_cache:pr,submodules/design-toolkit:vasic-digital/design-toolkit:pr,submodules/llmctl:vasic-digital/llmctl:pr,submodules/containers:vasic-digital/Containers:pr,submodules/claude_toolkit:vasic-digital/claude_toolkit:pr
