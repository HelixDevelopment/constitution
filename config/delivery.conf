# config/delivery.conf — §11.4.297(A) pull-request delivery declaration of THIS repository
# (HelixDevelopment/constitution; GitHub repository HelixDevelopment/HelixConstitution).
#
# DATA per §11.4.35. Account names live ONLY in this file (§11.4.297(D)(1)); no rule text names one.
# Format: key=value, one per line, '#' starts a comment (the format read by
# scripts/gates/cm_pr_delivery_account_name_free.sh). List values are comma-separated.
#
# Recorded operator decision (§11.4.66): 2026-11-16, given through an interactive question to the
# conductor and relayed to the fixer agent; the operator's answer on the merger, as relayed:
#   "You do all PRs reviews and merging into main for main repo and all Submodules fully recursively"
# Reviewer accounts (as relayed): one GitHub account, which is also the account that opens the
# pull requests. See the note at pr_reviewers below: under §11.4.297(D)(2) that combination means
# no reviewer is possible, and the delivery ends non-zero until the operator changes it.
# Status: PROVISIONAL (§11.4.297(G)): this file is a declaration; no delivery tool reads it yet,
# and nothing here is ENFORCED.

decision_id=OPD-2026-11-16-PR-DELIVERY
decision_date=2026-11-16

# Closed set: direct | pr
mode=pr
base=main

# The GitHub-only remote as derived by install_upstreams.sh (§11.4.111 naming; measured 2026-11-16
# in a scratch clone). NOT 'origin': origin is the multi-upstream fan-out remote, so a task-branch
# push through it would land the branch on every mirror and widen retirement (§11.4.297(C)(4)).
pr_remote=github_helixdevelopment
# Canonical GitHub name as the API reports it (measured 2026-11-16); the upstream URL
# git@github.com:HelixDevelopment/HelixConstitution.git redirects to it.
pr_repository=HelixDevelopment/constitution

# Branch name <prefix>/<id>-<slug>. 'task' is the prefix of the operator's own pull requests
# #7, #8 and #9 (task/ATM-2188-..., task/ATM-2190-...).
branch_prefix=task

# Reviewer list of this repository. As relayed: one account, the same account as the author.
# §11.4.297(D)(2): the author is skipped; when the author is the only listed account, no reviewer
# is possible and the delivery reports it and ends non-zero. This is the recorded state, not a fault
# of this file: see open question Q1 recorded in tracker item CON-423.
pr_reviewers=milos85vasic
pr_assignees=milos85vasic

# Closed set: ff-only | merge-commit. merge-commit = first parent the previous main tip, second
# parent the reviewed head (§11.4.297(A.3)); measured: PRs #7, #8 and #9 landed in this form.
landing_form=merge-commit

# Closed set: author-agent | human. Operator answer: the agent merges.
merger=author-agent

protected_branches=main

# Closed set: off | expected | enforced. 'off': no local guard is installed (none exists in this repo).
direct_push_guard=off

# Shared single files: pull requests that change one of these land one at a time (§11.4.297(B)(5)).
shared_single_files=docs/CONTINUATION.md,docs/workable_items.db,CHANGELOG.md,docs/requests/history.md

# Tool-written ledger paths (§11.4.297(E)(3)). None declared yet: open question Q5 (CON-423).
tool_written_paths=

evidence_dir=docs/qa

# Merge window in hours (§11.4.297(A.2)): a GO older than this is reported stale. open question Q6 (CON-423).
merge_window_hours=24

# §11.4.288 own repositories covered recursively (own-org list: vasic-digital, HelixDevelopment).
# Format per entry: <path>:<github org/repo>:<mode>. Third-party submodules are excluded
# (§11.4.288(A)): superspec, open_design, watch-skill, repo-qa, verify, claude-video,
# agentic-validation, verification, repo-proof, donespec, skill-doctor, verfix, MVT, wave-dpctf,
# mcp-audio-tweaker, polyscreen-mcp, video-quality-mcp.
# Each submodule's own reviewer list, upstreams and platform settings are NOT measured here:
# open question Q3 (CON-423). The mode applies to each as relayed ("all Submodules fully recursively").
own_repositories=.:HelixDevelopment/HelixConstitution:pr,submodules/docs_chain:vasic-digital/docs_chain:pr,submodules/continuum:vasic-digital/continuum:pr,submodules/anti_bluff:vasic-digital/anti_bluff:pr,submodules/session_orchestrator:vasic-digital/session_orchestrator:pr,submodules/token_optimizer:vasic-digital/token_optimizer:pr,submodules/helix_perf_cache:HelixDevelopment/helix_perf_cache:pr,submodules/design-toolkit:vasic-digital/design-toolkit:pr,submodules/llmctl:vasic-digital/llmctl:pr,submodules/containers:vasic-digital/Containers:pr,submodules/claude_toolkit:vasic-digital/claude_toolkit:pr
