# T086 negative-control fixture: "an item with complete evidence classifies
# without E9" (tasks.md T086 line). data-model.md §6.1: "E9 unclassifiable |
# Evidence insufficient for E1..E8 ... | settling_evidence naming the missing
# evidence". The false-positive guard this fixture proves (constitution
# 11.4.201(1)): a classifier that defaults to E9 whenever an item's real history
# is non-trivial (multiple stages, a compound evidence string, a device-pending
# marker) -- rather than reserving E9 for GENUINELY insufficient evidence -- is
# just as defective as one that never fires E9 at all.
#
# Window: --as-of 2026-07-23 --window-days 0 => [2026-07-23, 2026-07-23]
# inclusive. Real, live-verified fact (2026-09-29, docs/workable_items.db):
# exactly ONE item_history row has event_type='Reopened' AND on_date='2026-07-23'
# -- ATM-799 (rowid=684). A real, natural single-item window (2026-07-10 was
# deliberately NOT used for this fixture: it contains TWO distinct reopened
# items, ATM-277 and ATM-627, which would need their own fully-researched
# classifications to satisfy EC-001's one-entry-per-item requirement for that
# window -- out of scope for this fixture's specific, narrow assertion).
#
# Provenance for "complete evidence" + the E4 guard-not-run classification
# (real, citable, never guessed -- constitution 11.4.6):
#   - item_history rowids (docs/workable_items.db, live-queried 2026-09-29):
#       id=613 Fixed    2026-07-18 evidence_path=
