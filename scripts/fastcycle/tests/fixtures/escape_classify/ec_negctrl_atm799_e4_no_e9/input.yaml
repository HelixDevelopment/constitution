#   - Both referenced files are REAL and exist on disk (verified 2026-09-29):
#       docs/research/audio_dialog_hang_20260717/ROOT_CAUSE.md
#       device/rockchip/rk3588/tests/test_atm799_jack_es8388_switch_red.sh
#       constitution/docs/research/quality/remediation/PROJECT_GAP_AUDIT.md
#   - PROJECT_GAP_AUDIT.md line 43 (G6 "Cross-layer verification gaps") names
