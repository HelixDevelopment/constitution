# helix-deps.yaml — Universal Helix Constitution
#
# Per §11.4.31 (Submodule-Dependency-Manifest Mandate): every own-org
# submodule chain MUST ship a machine-readable dependency manifest at
# this canonical path, listing every own-org depth-1 dependency so
# consumers can mechanically reconstruct the graph without git-walking.
#
# The constitution submodule itself acts as a HUB (§11.4.28(C) carve-out):
# it hosts own-org depth-1 dependencies — the reusable engines under
# `submodules/` (llmctl added 2026-10-13, §11.4.277; containers, claude_toolkit
# and superspec 2026-10-21) plus the OpenDesign design-toolkit, and ONE
# third-party REFERENCE checkout (open_design, §11.4.162).
# RULE (§11.4.28(C) EXTENSION, 2026-10-21 — one source of truth): a hub engine
# MUST NOT nest this constitution, the hub, another hub engine or any own-org
# repository the hub already provides flat; it resolves the canon with the
# single documented resolver instead. This supersedes the 2026-10-13
# mutual-reference decision for llmctl. Gate CM-HUB-ENGINE-NO-OWNORG-NESTING
# (scripts/gates/cm_hub_engine_no_ownorg_nesting.sh) enforces it by name
# matching on each engine's nested URLs; CM-LLMCTL-SUBMODULE-NONRECURSIVE
# (scripts/gates/cm_llmctl_submodule_nonrecursive.sh) stays as a narrower
# re-entry check. Both run from scripts/post_update_hook.sh on every pull.
# HONEST STATE (measured 2026-10-22, §11.4.6): llmctl at f42bad6 nests no
# own-org repository any more (only third-party llama.cpp and colibri; it
# resolves constitution, containers and superspec via lib/resolve_deps.sh), so
# both gates PASS for llmctl. claude_toolkit at 1f6dad3 is flat as well: its
# only nested submodule is third-party submodules/go (go.googlesource.com), its
# own-org deps (HelixConstitution, containers, challenges, LLMsVerifier,
# claude-code-router) resolve flat via scripts/resolve_deps.sh, and it ships a
# tracked helix-deps.yaml; CM-HUB-ENGINE-NO-OWNORG-NESTING and
# CM-HELIX-DEPS-MANIFEST-PRESENT PASS for it. Both entries keep the marker
# `recursive_init: false` — consumers initialise them one level only, WITHOUT
# --recursive (llmctl: llama.cpp + colibri; claude_toolkit: the Go toolchain
# checkout under submodules/go — third-party nests are never initialised
# recursively).
#
# Discovered gap: constitution/helix-deps.yaml was MISSING until
# 2026-08-15 (chain-audit finding, subagent a2cf7f91). Created inline
# per operator IMPORTANT mandate 2026-08-15: "Pay attention on
# constitution Submodule and its own dependency Submodules and how they
# are all connected and used! Make sure nothing is hanging or use of it
# is broken!!!"
#
# SSH-only per Hard Stop #2 (verified zero HTTPS URLs across recursive
# chain). Refs are pinned tags where available (§11.4.113 fetch-first +
# reproducibility) and pinned shas otherwise (until upstream tags land).

