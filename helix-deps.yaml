# helix-deps.yaml — Universal Helix Constitution
#
# Per §11.4.31 (Submodule-Dependency-Manifest Mandate): every own-org
# submodule chain MUST ship a machine-readable dependency manifest at
# this canonical path, listing every own-org depth-1 dependency so
# consumers can mechanically reconstruct the graph without git-walking.
#
# The constitution submodule itself acts as a HUB (§11.4.28(C) carve-out):
# it hosts own-org depth-1 dependencies — the reusable engines under
# `submodules/` (llmctl added 2026-10-13, §11.4.277) plus the OpenDesign
# design-toolkit.
# NO nested own-org submodule chains exist in any of the 7 engines
# (each engine has `helix-deps.yaml { deps: [] }` per §11.4.28(C) depth-1
# invariant).
#
# Discovered gap: constitution/helix-deps.yaml was MISSING until
# 2026-08-15 (chain-audit finding, subagent a2cf7f91). Created inline
# per operator IMPORTANT mandate 2026-08-15: "Pay attention on
# constitution Submodule and its own dependency Submodules and how they
# are all connected and used! Make sure nothing is hanging or use of it
# is broken!!!"
#
# SSH-only per Hard Stop #2 (verified zero HTTPS URLs across recursive
# chain). Refs are pinned tags where available (§11.4.113 fetch-first +
# reproducibility) and pinned shas otherwise (until upstream tags land).

schema_version: 1

deps:
  # ─── Reusable engines under submodules/ (grouped layout) ────────────
  - name: docs_chain
    ssh_url: git@github.com:vasic-digital/docs_chain.git
    ref: helixcode-v1.1.0    # §11.4.113 fetch-first pinned tag
    why: "§11.4.106 canonical mechanical documentation-and-database dependency-propagation engine — content-addressed Merkle sync/verify with atomic-rename commits, honest ToolAbsentError SKIPs, gates docs/DB sync at build/commit/constitution-pull seams"
    layout: grouped

  - name: continuum
    ssh_url: git@github.com:vasic-digital/continuum.git
    ref: d88a007             # pinned sha (no upstream tag yet)
    why: "§11.4.207 instant multi-stream resume engine — content-addressed Merkle snapshot + append-only ledger + atomic single-writer refs so a fresh session resumes the WHOLE fleet at O(changed streams), self-validating oracle (golden-good/bad/negative-control)"
    layout: grouped

  - name: anti_bluff
    ssh_url: git@github.com:vasic-digital/anti_bluff.git
    ref: bcc7f3d             # pinned sha
    why: "shared anti-bluff verification primitives (§11.4 covenant family) — ab_pass_with_evidence / ab_skip_with_reason helpers, sink-side taxonomy per §11.4.69, stress+chaos helpers per §11.4.85; consumed by challenge scripts across the constitution consumer fleet"
    layout: grouped

  - name: session_orchestrator
    ssh_url: git@github.com:vasic-digital/session_orchestrator.git
    ref: 78b77bb             # pinned sha
    why: "§11.4.187 automatic multi-track ruler orchestration substrate — headless spawn primitive (claude -p --output-format stream-json + session_id from init event), per-subscription auth isolation, rate-limit → alias rebind, crash-resilient ruler self-supervisor"
    layout: grouped

  - name: token_optimizer
    ssh_url: git@github.com:vasic-digital/token_optimizer.git
    ref: c0591b5             # pinned sha
    why: "§11.4.141 heavy token-optimization engine — compact-anchor rewriter, targeted-read planner, evidence-hash reference builder, subagent-context-isolation helpers; always-on default per §11.4.198 (default mechanisms always-on)"
    layout: grouped

  - name: helix_perf_cache
    ssh_url: git@github.com:HelixDevelopment/helix_perf_cache.git
    ref: 6adcfb2             # pinned sha (HelixDevelopment org, not vasic-digital)
    why: "shared performance cache (build/test/measurement result memoization with fingerprint invalidation) — reduces the §11.4.24 build-resource stats window churn + supports §11.4.230 pipeline-overlap parallelization by caching invariant results across stages"
    layout: grouped

  - name: llmctl
    ssh_url: git@github.com:vasic-digital/llmctl.git
    ref: v3.2.1              # pinned tag (commit db07bd5628ee1bd5c56ff30fe35c4d631acb59fa); exists on the remote
    why: "§11.4.277 llmctl model validation gate + host-safe model units — the vendored model manager through which every model is acquired, started, validated (`llmctl validate` / `require-validated`) and stopped; §11.4.278 vision step consumes its validated `vision` profile. NOTE: llmctl vendors this constitution as its own `constitution` submodule (mutual reference) — operator decision pending, see §11.4.277(B)."
    layout: grouped

  # ─── OpenDesign design-toolkit (flat layout, top-level) ──────────────
  - name: design-toolkit
    ssh_url: git@github.com:vasic-digital/design-toolkit.git
    ref: 16e4e76             # pinned sha
    why: "§11.4.162 OpenDesign UI design-system engine — canonical machine-readable design-token source (§11.4.216) + brand contract (§11.4.217) + living design-library catalogue (§11.4.218); consumed by every project that ships a user-facing UI"
    layout: flat

transitive_handling:
  # §11.4.28(C) depth-1 carve-out: constitution IS the hub, its engines
  # never nest own-org deps. `recursive: true` still declared so consumer
  # tooling walks the manifest chain; each engine's own helix-deps.yaml
  # declares `deps: []` (leaf), so the walk terminates naturally.
  recursive: true

  # §11.4.6 no-guessing: conflicts (two dep entries diverging on ref)
  # are OPERATOR decisions, never silently merged. Consumer tooling
  # halts on conflict + surfaces the divergence.
  conflict_resolution: operator-required

# §11.4.28(C) depth-1 invariant applies: no language-specific subtree
# resolution; consumers reach every engine directly from the parent root
# per the mandated layout (grouped vs flat as declared per-dep above).
language_specific_subtree: false

