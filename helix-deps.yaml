transitive_handling:
  # §11.4.28(C) depth-1 carve-out: constitution IS the hub. Engines MUST be
  # leaves for own-org repositories (`deps: []`): they resolve the canon and
  # their siblings through the hub, never by nesting them. `recursive: true`
  # stays the default so tooling walks the manifest chain, with ONE explicit
  # exception: any dep entry carrying `recursive_init: false` (llmctl and
  # claude_toolkit — both nest third-party repositories only) MUST
  # be neither initialised with `git submodule update --recursive` nor walked
  # into by manifest-walking tooling. Entries with `third_party: true` are not
  # own-org dependencies and are never walked for own-org manifests.
  # CM-HUB-ENGINE-NO-OWNORG-NESTING and CM-LLMCTL-SUBMODULE-NONRECURSIVE check this.
  recursive: true

  # §11.4.6 no-guessing: conflicts (two dep entries diverging on ref)
  # are OPERATOR decisions, never silently merged. Consumer tooling
  # halts on conflict + surfaces the divergence.
  conflict_resolution: operator-required

# §11.4.28(C) depth-1 invariant applies: no language-specific subtree
# resolution; consumers reach every engine directly from the parent root
# per the mandated layout (every current entry is grouped under submodules/).
language_specific_subtree: false

