# Helix Constitution — Action-Prefix Registry (§11.4.140)
#
# Single source of truth for the universal "ACTION_NAME ::" prompt-prefix system.
#
# Both LAYER 1 (agent self-recognition via CLAUDE.md / AGENTS.md / GEMINI.md /
# QWEN.md per §11.4.35) and LAYER 2 (the Claude Code UserPromptSubmit hook
# scripts/hooks/action_prefix_expand.sh + the generated per-agent slash commands)
# read THIS file. Adding a new action = adding one `actions[]` row — NO code
# change in either layer (the registry is data, not code).
#
# Decoupling (§11.4.28): this registry carries NO project-specific data. A
# consuming project ships its OWN actions/registry.yaml (or inherits this default
# by reference, like the §11.4.80 codegraph_* scripts). The scripts read the
# registry path from $HELIX_ACTION_REGISTRY (default: this file).
#
# Grammar (precise spec, §11.4.140 + GRAMMAR_ADDENDUM 2026-06-09 + arrow form
# 2026-07-02): every registered action is invocable in FIVE equivalent forms —
# same action, same expansion, same execution — anchored to the prompt's first
# non-blank line:
#   (1) `ACTION :: <rest>`            bare `::` form (default namespace)
#   (2) `PREFIX::ACTION :: <rest>`    namespaced `::` form
#   (3) `/ACTION <rest>`             bare slash form (honored unless host-command collision)
#   (4) `/PREFIX::ACTION <rest>`     namespaced slash form (ALWAYS unambiguous)
#   (5) `ACTION ---> <rest>`          bare arrow form (default namespace);
#       `PREFIX::ACTION ---> <rest>`  namespaced arrow form
# The token is UPPERCASE-only ([A-Z][A-Z0-9_]*). `PREFIX` is an action NAMESPACE;
# the reserved default namespace is `DEFAULT`. The namespace separator `::` inside
# the token carries NO surrounding spaces (`PREFIX::ACTION`) — DISTINCT from the
# action-body separator ` :: ` (one ASCII space on each side) used in forms 1/2,
# the arrow-body separator ` ---> ` (one ASCII space on each side) used in form 5,
# and the slash-body separator ` ` (one space) used in forms 3/4. A leading
# backslash escapes the prefix (literal, no expansion) for the `::`, arrow, and
# slash forms (`\BACKGROUND :: x`, `\BACKGROUND ---> x`, `\/BACKGROUND x`).
# Stacked prefixes ("A :: B :: rest") apply outer-to-inner. An unknown
# grammar-shaped token is NEVER silently expanded or dropped — ask which
# registered action was meant (§11.4.66 / §11.4.105), never invent an expansion
# (§11.4.6). Token/namespace are UPPERCASE; FILE/DIR names stay lowercase
# snake_case (§11.4.29).

schema_version: 1

grammar:
  # ── `::` form (forms 1 + 2) ──────────────────────────────────────────────
  prefix_regex: '^([A-Z][A-Z0-9_]*) :: '        # legacy bare-`::` anchor (form 1); kept for back-compat
  colon_form_regex: '^(?:([A-Z][A-Z0-9_]*)::)?([A-Z][A-Z0-9_]*) :: (.*)$'  # forms 1+2: g1=optional PREFIX, g2=ACTION, g3=rest
  # ── single-colon form (form 6, §11.4.202 — `ISSUE: <text>`) ──────────────
  # REGISTERED-ACTION-ONLY by construction: a single-colon token that is NOT a
  # registered action is a NO-OP (an ordinary prompt), NEVER an ASK and NEVER a
  # sub-system shortcut. Rationale (§11.4.6, honest): `TODO:` / `WARNING:` /
  # `FIXME:` are ordinary English prose openers that share this shape — routing
  # them to the §11.4.66 clarify path would turn every such sentence into an
  # operator question. (A REGISTERED single-colon token DOES expand — e.g. the
  # §11.4.140 severity markers `CRITICAL:` / `IMPORTANT:` / `NOTE:` and the
  # §11.4.202 reporting directives `BUG:` / `TASK:` / `ISSUE:`.) The ` :: ` /
  # ` ---> ` / `/` forms keep
  # their ASK-on-unknown behaviour (their shapes do not occur in prose).
  single_colon_form_regex: '^(?:([A-Z][A-Z0-9_]*)::)?([A-Z][A-Z0-9_]*): (.*)$'  # form 6: g1=optional PREFIX, g2=ACTION, g3=rest
  single_colon_registered_only: true            # unknown single-colon token ⇒ noop (never ask, never subsystem)
  single_colon_body_separator: ': '             # token <-> rest: colon + ONE space, no space before the colon
  # ── slash form (forms 3 + 4) ─────────────────────────────────────────────
  slash_form_regex: '^/(?:([A-Z][A-Z0-9_]*)::)?([A-Z][A-Z0-9_]*)\s+(.*)$'   # forms 3+4: g1=optional PREFIX, g2=ACTION, g3=rest
  # ── arrow form (form 5) ──────────────────────────────────────────────────
  arrow_form_regex: '^(?:([A-Z][A-Z0-9_]*)::)?([A-Z][A-Z0-9_]*) ---> (.*)$'  # form 5: g1=optional PREFIX, g2=ACTION, g3=rest
  arrow_body_separator: ' ---> '                 # token <-> rest, spaces both sides (arrow form)
  default_namespace: DEFAULT                     # reserved default-namespace literal
  namespace_separator: '::'                      # inside the token, NO surrounding spaces
  body_separator: ' :: '                         # token <-> rest, spaces both sides ('::' form)
  slash_prefix: '/'                              # slash-form leader
  slash_body_separator: ' '                      # token <-> rest (slash form)
  case_sensitive: true                           # action names are UPPERCASE-only
  multiple_prefixes: stack                       # "A :: B :: rest" applies A then B
  escape: '\'                                    # "\BACKGROUND :: x" / "\/BACKGROUND x" → literal, no expansion

actions:
  - name: BACKGROUND
    version: 2
    namespaces: [DEFAULT]                         # which namespaces this action is registered under
    slash_bare: auto                              # bare /BACKGROUND honored unless a host-command collision
    slash_conflicts: []                           # known colliding host slash commands (forces /DEFAULT::BACKGROUND)
    summary: >-
      Run the remainder of the prompt as a DURABLE (never-lost), background,
      subagent-driven work stream in parallel with all main work, producing
      rock-solid physical proof.
    expansion: >-
      BACKGROUND WORK PREFERENCES — DURABILITY (never lost, never forgotten;
      composes §11.4.87 / §11.4.94 / §11.4.97 / §11.4.103 / §11.4.126): the MOMENT
      this BACKGROUND request is received it MUST be recorded as a durable, tracked
      work item in the project background-work queue
      (docs/requests/background_queue.md — with an id, received-timestamp, status,
      and any blocker) so it can NEVER be lost, dropped, or forgotten. It MUST be
      executed: if it can run now, run it subagent-driven in parallel with all main
      work streams; if it is currently BLOCKED (subagent dispatch unavailable, a
      build/flash in flight, an operator-gated decision, or any other external
      dependency), it MUST stay QUEUED with its blocker recorded and be re-attempted
      automatically at the next opportunity — including the next fresh session — and
      re-surfaced to the operator every session until it reaches a terminal state
      (done / operator-cancelled). Silently dropping, or deferring-and-forgetting, a
      BACKGROUND request is FORBIDDEN. THEN execute the task as follows: The
      following prompt that we will provide MUST BE executed in background in
      parallel with all main work streams using the subagents-driven development
      approach! All work done MUST PRODUCE rock solid evidence covered with hard
      physical proof(s) that all done is working as expected and as specified
      without any false results and without any bluff!
    rules:
      - "The expansion REPLACES the 'BACKGROUND :: ' prefix; the remainder of the prompt is the actual task to perform."
      - "PURPOSE — non-interrupting (v2): a BACKGROUND request runs in PARALLEL with the main work stream and MUST NOT interrupt, block, preempt, or divert it. If no genuine background/parallel capacity exists right now (e.g. subagent dispatch unavailable in the current session), the request stays QUEUED per the durability rule rather than being run inline in the main stream — running it inline would interrupt the main work, which is exactly what BACKGROUND forbids."
      - "Concurrency (v2): MULTIPLE BACKGROUND requests MAY run simultaneously, PREFERABLY subagent-driven (§11.4.70 / §11.4.20), in a CONTROLLED manner bounded by available capacity — §12.6 (≤60% host memory), §11.4.58 (≤6 concurrent agents), §11.4.103 (standing 3–6 parallel background streams + auto-backfill). The durable queue is drained continuously up to that capacity; items beyond capacity stay QUEUED, never dropped."
      - "Durability (never-lost, v2): on receipt, record the request in docs/requests/background_queue.md (id + received-timestamp + status + blocker); keep it QUEUED and re-surfaced every session until terminal (done / operator-cancelled); a BACKGROUND request MUST NEVER be silently dropped or deferred-and-forgotten — if blocked now, it is re-attempted at the next opportunity incl. a fresh session."
      - "Compose with §11.4.70 / §11.4.20 (subagent-driven), §11.4.58 / §11.4.103 (parallel streams), §11.4.89 (background execution), §11.4.87 / §11.4.94 / §11.4.97 / §11.4.126 (endless-loop + zero-idle + default-autonomous-loop — the durable queue is drained continuously), §11.4.5 / §11.4.69 / §11.4.107 (captured physical evidence), §11.4 (anti-bluff)."
    composes_with:
      - "11.4.20"
      - "11.4.58"
      - "11.4.70"
      - "11.4.87"
      - "11.4.89"
      - "11.4.94"
      - "11.4.97"
      - "11.4.103"
      - "11.4.126"
      - "11.4.5"
      - "11.4.69"
      - "11.4.107"

  - name: REMINDER
    version: 1
    namespaces: [DEFAULT]                         # which namespaces this action is registered under
    slash_bare: auto                              # bare /REMINDER honored unless a host-command collision
    slash_conflicts: []                           # known colliding host slash commands (forces /DEFAULT::REMINDER)
    summary: >-
      Re-surface previously-scheduled, critical, status-UNCERTAIN work; verify
      actual status from captured evidence before acting (never assume done).
    expansion: >-
      REMINDER — the following names work that was scheduled or requested
      earlier, is CRITICAL, and whose CURRENT STATUS IS UNCERTAIN; the operator is
      re-surfacing it. Do NOT assume it is done or not done (§11.4.6 no-guessing —
      a false 'already done' is a §11.4 PASS-bluff, a false 'not started' wastes
      effort). FIRST verify the ACTUAL current status from captured evidence: git
      log/state, the task list, running and queued background work (incl. the
      §11.4.140 BACKGROUND durable queue docs/requests/background_queue.md), test
      artifacts, the workable-items DB + docs, the recording corpus. THEN act on
      the delta: if genuinely complete AND evidence-verified, report the captured
      proof; if partially done, resume from the exact point; if not started or
      blocked, action it NOW with high priority — or surface the block per
      §11.4.66/§11.4.101 while keeping every non-blocked part progressing per
      §11.4.94/§11.4.97. Treat as high priority.
    rules:
      - "The expansion REPLACES the 'REMINDER ---> ' / 'REMINDER :: ' / '/REMINDER' prefix; the remainder of the prompt is the work being reminded about."
      - "VERIFY-BEFORE-REPORT is mandatory — a REMINDER response that claims status without captured evidence is a §11.4 bluff (§11.4.6 / §11.4.123)."
      - "A REMINDER never silently no-ops: it ALWAYS produces a status verdict (done+proof / resuming-from-X / starting-now / blocked-because-Y)."
      - "Compose §11.4.6 (no-guessing), §11.4.87 / §11.4.94 / §11.4.97 / §11.4.103 (endless-loop + zero-idle + parallel streams), §11.4.108 (four-layer verification of 'done'), §11.4.130 (validate-just-fixed-first), §11.4.147 (crashed/lost-work never forgotten)."
    composes_with:
      - "11.4.6"
      - "11.4.87"
      - "11.4.94"
      - "11.4.97"
      - "11.4.103"
      - "11.4.108"
      - "11.4.130"
      - "11.4.147"

  # ── Severity / handling-priority markers (§11.4.140 extension, 2026-07-16) ───
  # CRITICAL / IMPORTANT / NOTE tag the REMAINDER of the prompt with a HANDLING
  # PRIORITY the way BACKGROUND tags it "run in background". They are ordinary
  # registry rows — every §11.4.140 form works out of the box (`CRITICAL :: x`,
  # `DEFAULT::CRITICAL :: x`, `/CRITICAL x`, `/DEFAULT::CRITICAL x`,
  # `CRITICAL ---> x`) PLUS the §11.4.202 single-colon form the operator actually
  # types (`CRITICAL: x`). Registering NOTE PROMOTES `NOTE:` from an
  # ordinary-prose NO-OP to a registered action — the ordinary-prose single-colon
  # examples are now `TODO:` / `WARNING:` / `FIXME:` (still unregistered ⇒ no-op).
  # These markers change HOW the remainder is handled (priority + rigor); they do
  # NOT pick a workable-item Type — when the remainder is a report the §11.4.202
  # BUG / TASK / ISSUE machinery still classifies + tracks it.
  - name: CRITICAL
    version: 1
    namespaces: [DEFAULT]                         # which namespaces this action is registered under
    slash_bare: auto                              # bare /CRITICAL honored unless a host-command collision
    slash_conflicts: []                           # no known colliding host slash command
    summary: >-
      Tag the remainder of the prompt HIGHEST-PRIORITY / potentially
      release-blocking — address with maximum urgency + rigor, track it, and do
      not defer it behind lower-priority work.
    expansion: >-
      CRITICAL — treat the remainder of this prompt as the HIGHEST-PRIORITY,
      potentially RELEASE-BLOCKING matter (composes §11.4.72 audio /
      most-critical-first + §11.4.42 / §11.4.132 risk-ordered priority). Address
      it with maximum urgency and full rigor AHEAD of routine or lower-priority
      work — do NOT defer, park, or bury it behind other items (a critical matter
      parks other work, never the reverse; §11.4.94 / §11.4.97 / §11.4.101).
      Track it as a high-severity workable item so it can never be lost — when it
      is a reportable defect / task / feature, route it through the §11.4.202
      BUG / TASK / ISSUE machinery (§11.4.197 a started requirement never
      evaporates). Apply the full §11.4 anti-bluff covenant — every claim carries
      captured physical evidence (§11.4.5 / §11.4.69 / §11.4.107), never a
      metadata-only / absence-of-error PASS. When an issue / bug / regression /
      failure is involved, auto-activate systematic-debugging BEFORE any fix
      (§11.4.102 Iron Law: no fixes without root-cause investigation first). THEN
      handle the remainder of the prompt as that highest-priority matter.
    rules:
      - "The expansion PREPENDS the CRITICAL handling guidance; the remainder of the prompt (in ANY of its forms — 'CRITICAL: ', 'CRITICAL :: ', 'CRITICAL ---> ', '/CRITICAL ', '/DEFAULT::CRITICAL ') is the matter to handle."
      - "CRITICAL is a HANDLING-PRIORITY marker, NOT a reporting channel and NOT a §11.4.16 workable-item Type — it changes HOW the remainder is handled (priority + rigor), it does not itself pick a Type. When the remainder IS a report, the §11.4.202 BUG/TASK/ISSUE machinery still classifies + tracks it."
      - "Highest priority: address AHEAD of lower-priority work; NEVER defer a CRITICAL matter behind routine work (§11.4.72 / §11.4.42 / §11.4.132)."
      - "Auto-activate §11.4.102 systematic-debugging when an issue / bug / failure is involved (Iron Law: no fixes without root-cause investigation first)."
      - "Full anti-bluff (§11.4): captured physical evidence for every claim (§11.4.5 / §11.4.69 / §11.4.107), never a false result."
    composes_with:
      - "11.4"
      - "11.4.42"
      - "11.4.72"
      - "11.4.94"
      - "11.4.97"
      - "11.4.101"
      - "11.4.102"
      - "11.4.132"
      - "11.4.197"
      - "11.4.202"
      - "11.4.5"
      - "11.4.69"
      - "11.4.107"

  - name: IMPORTANT
    version: 1
    namespaces: [DEFAULT]                         # which namespaces this action is registered under
    slash_bare: auto                              # bare /IMPORTANT honored unless a host-command collision
    slash_conflicts: []                           # no known colliding host slash command
    summary: >-
      Tag the remainder of the prompt HIGH-PRIORITY — prioritize it above routine
      work (but below a CRITICAL / release-blocking matter), track it, and apply
      full anti-bluff rigor.
    expansion: >-
      IMPORTANT — treat the remainder of this prompt as HIGH-PRIORITY: prioritize
      it ABOVE routine work (but BELOW a CRITICAL / release-blocking matter) per
      the §11.4.42 / §11.4.72 / §11.4.132 priority order. Track it as a workable
      item so it is never lost — when it is a reportable defect / task / feature,
      route it through the §11.4.202 BUG / TASK / ISSUE machinery (§11.4.197 a
      started requirement never evaporates). Apply the full §11.4 anti-bluff
      covenant — every claim carries captured physical evidence (§11.4.5 /
      §11.4.69 / §11.4.107), never a metadata-only / absence-of-error PASS. THEN
      handle the remainder of the prompt as that high-priority matter.
    rules:
      - "The expansion PREPENDS the IMPORTANT handling guidance; the remainder (in ANY of its forms — 'IMPORTANT: ', 'IMPORTANT :: ', 'IMPORTANT ---> ', '/IMPORTANT ', '/DEFAULT::IMPORTANT ') is the matter to handle."
      - "IMPORTANT is a HANDLING-PRIORITY marker (high-priority, BELOW CRITICAL), NOT a reporting channel and NOT a §11.4.16 Type."
      - "High priority: address ahead of routine work, below a CRITICAL matter (§11.4.42 / §11.4.72 / §11.4.132)."
      - "Full anti-bluff (§11.4): captured physical evidence for every claim (§11.4.5 / §11.4.69 / §11.4.107)."
    composes_with:
      - "11.4"
      - "11.4.42"
      - "11.4.72"
      - "11.4.132"
      - "11.4.197"
      - "11.4.202"
      - "11.4.5"
      - "11.4.69"
      - "11.4.107"

  - name: NOTE
    version: 1
    namespaces: [DEFAULT]                         # which namespaces this action is registered under
    slash_bare: auto                              # bare /NOTE honored unless a host-command collision
    slash_conflicts: []                           # no known colliding host slash command
    summary: >-
      Capture the remainder of the prompt as durable CONTEXT / a note to remember
      (request-history + persistent memory), applied when relevant — not an
      urgent action unless it contains an explicit action.
    expansion: >-
      NOTE — the remainder of this prompt is CONTEXTUAL INFORMATION / a note to
      CAPTURE and REMEMBER, not necessarily an immediate action. Record it
      durably so it is never lost — in the operator request-history ledger
      (§11.4.208 / §11.4.210 zero-loss intake) and, when it is a non-obvious,
      durable project FACT, in persistent agent memory. Apply it when it becomes
      relevant. Do NOT treat it as an urgent action UNLESS the note itself
      contains an explicit action (then handle that action at its own stated
      priority). Record ONLY what the note actually says — never invent, infer,
      or embellish (§11.4.6 no-guessing); an undetermined detail is recorded as an
      explicit UNKNOWN, never fabricated. If the note describes a trackable defect
      / task / feature, route it through the §11.4.202 BUG / TASK / ISSUE
      machinery so it lands as a real workable item rather than merely a memory
      (§11.4.197 a started requirement never evaporates).
    rules:
      - "The expansion PREPENDS the NOTE handling guidance; the remainder (in ANY of its forms — 'NOTE: ', 'NOTE :: ', 'NOTE ---> ', '/NOTE ', '/DEFAULT::NOTE ') is the context to capture."
      - "NOTE = capture-as-context: record durably (request-history + persistent memory when it is a durable project fact); do NOT action it unless it contains an explicit action."
      - "Record only what the note says — never invent or infer (§11.4.6); an undetermined detail is an explicit UNKNOWN."
      - "Registering NOTE promotes the single-colon `NOTE:` form (§11.4.202 form 6) from an ordinary-prose NO-OP to this registered action; the ordinary-prose single-colon examples are now `TODO:` / `WARNING:` / `FIXME:`."
    composes_with:
      - "11.4.6"
      - "11.4.197"
      - "11.4.202"
      - "11.4.208"
      - "11.4.210"

  # ── Reporting directives (§11.4.202, 2026-07-15) ────────────────────────────
  # BUG / TASK / ISSUE turn a plain-language report into a fully-populated,
  # fully-synced workable item. They are ordinary registry rows — every §11.4.140
  # form works out of the box (`BUG :: x`, `DEFAULT::BUG :: x`, `/DEFAULT::BUG x`,
  # `BUG ---> x`) PLUS the §11.4.202 single-colon form (`BUG: x`).
  - name: BUG
    version: 1
    namespaces: [DEFAULT]
    # `/bug` is a documented Claude Code BUILT-IN (reports a bug to Anthropic), so
    # the bare slash form is NOT honored for BUG. The namespaced slash form
    # `/DEFAULT::BUG …` is always unambiguous (§11.4.140 conflict rule), and the
    # `BUG: …` / `BUG :: …` / `BUG ---> …` forms are unaffected.
    slash_bare: auto
    slash_conflicts: [bug]
    summary: >-
      Report a product DEFECT — create a fully-populated Type=Bug workable item and
      drive the full DB → docs → external-tracker sync.
    expansion: >-
      REPORT DIRECTIVE — BUG (§11.4.202). The remainder of this prompt is a REPORT
      of a product DEFECT (a regression / user-visible broken behaviour). It MUST
      be turned into a real, fully-populated workable item — never merely
      acknowledged, never answered in prose alone, never silently dropped. Create
      it through the project's reporting engine
      (`constitution/scripts/reporting/report_item.sh --kind bug --title <t>
      --report <text>`), which (1) creates the item with Type=Bug + Status=Queued +
      a stable auto-incremented ticket id in the workable-items SQLite
      single-source-of-truth (§11.4.93 / §11.4.95 / §11.4.54), carrying the
      §11.4.148 / §11.4.171 comprehensive structured description (WHAT / SCOPE /
      REPRODUCTION / ACCEPTANCE); (2) regenerates EVERY derived document from the
      DB — Issues / Fixed / the summaries + their HTML / PDF / DOCX siblings — via
      the project's configured sync command (§11.4.12 / §11.4.53 / §11.4.65 /
      §11.4.106); (3) pushes the new item to EVERY configured external tracker
      (§11.4.148 D5). A tracker whose credentials or client are absent is SKIPPED
      with an honest reason (§11.4.10 / §11.4.6 / §11.4.3) — a push is NEVER faked
      and its absence is NEVER hidden. Report back the assigned ticket id, the sync
      verdict, and each tracker's verdict with its captured-evidence path (§11.4.5
      / §11.4.69). THEN, if the defect is actionable now, investigate it under
      §11.4.102 systematic-debugging (root cause BEFORE any fix).
    rules:
      - "The expansion REPLACES the 'BUG' prefix in ANY of its forms ('BUG: ', 'BUG :: ', 'BUG ---> ', '/DEFAULT::BUG '); the remainder of the prompt is the report text."
      - "Type is FIXED to Bug (§11.4.16 closed set) — BUG never creates a Feature or a Task."
      - "The item MUST be created before any other response; a report that is discussed but never tracked is a §11.4.202 violation (the requirement silently evaporates — §11.4.197)."
      - "NEVER fake a tracker push. Absent credentials / absent client ⇒ honest SKIP-with-reason + the item still lands in the DB + docs (§11.4.10 / §11.4.6)."
      - "Compose §11.4.202 (this directive), §11.4.93 / §11.4.95 (DB SSoT), §11.4.15 / §11.4.16 / §11.4.54 (status + type + id), §11.4.148 / §11.4.171 (comprehensive description), §11.4.106 / §11.4.12 / §11.4.53 / §11.4.65 (doc sync), §11.4.102 (systematic-debugging on the defect)."
    composes_with:
      - "11.4.202"
      - "11.4.93"
      - "11.4.95"
      - "11.4.15"
      - "11.4.16"
      - "11.4.54"
      - "11.4.148"
      - "11.4.171"
      - "11.4.106"
      - "11.4.102"

  - name: TASK
    version: 1
    namespaces: [DEFAULT]
    slash_bare: auto
    slash_conflicts: []
    summary: >-
      Report an internal WORKSTREAM item — create a fully-populated Type=Task
      workable item and drive the full DB → docs → external-tracker sync.
    expansion: >-
      REPORT DIRECTIVE — TASK (§11.4.202). The remainder of this prompt is a REPORT
      of an internal WORKSTREAM item (refactor / doc / infra / gate / audit /
      chore). It MUST be turned into a real, fully-populated workable item — never
      merely acknowledged, never silently dropped. Create it through the project's
      reporting engine (`constitution/scripts/reporting/report_item.sh --kind task
      --title <t> --report <text>`), which (1) creates the item with Type=Task +
      Status=Queued + a stable auto-incremented ticket id in the workable-items
      SQLite single-source-of-truth (§11.4.93 / §11.4.95 / §11.4.54), carrying the
      §11.4.148 / §11.4.171 comprehensive structured description (WHAT / SCOPE /
      REPRODUCTION-or-CONTEXT / ACCEPTANCE); (2) regenerates EVERY derived document
      from the DB — Issues / Fixed / the summaries + their HTML / PDF / DOCX
      siblings — via the project's configured sync command (§11.4.12 / §11.4.53 /
      §11.4.65 / §11.4.106); (3) pushes the new item to EVERY configured external
      tracker (§11.4.148 D5). A tracker whose credentials or client are absent is
      SKIPPED with an honest reason (§11.4.10 / §11.4.6 / §11.4.3) — a push is
      NEVER faked. Report back the assigned ticket id, the sync verdict, and each
      tracker's verdict with its captured-evidence path (§11.4.5 / §11.4.69).
    rules:
      - "The expansion REPLACES the 'TASK' prefix in ANY of its forms ('TASK: ', 'TASK :: ', 'TASK ---> ', '/TASK ', '/DEFAULT::TASK '); the remainder is the report text."
      - "Type is FIXED to Task (§11.4.16 closed set) — TASK never creates a Bug or a Feature."
      - "The item MUST be created before any other response (§11.4.202 / §11.4.197 — a started requirement never evaporates)."
      - "NEVER fake a tracker push — honest SKIP-with-reason when credentials / client are absent (§11.4.10 / §11.4.6)."
    composes_with:
      - "11.4.202"
      - "11.4.93"
      - "11.4.95"
