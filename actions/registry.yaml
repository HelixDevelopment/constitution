  - name: ISSUE
    version: 1
    namespaces: [DEFAULT]
    slash_bare: auto
    slash_conflicts: []
    summary: >-
      Report ANYTHING trackable — classify into the §11.4.16 closed set
      {Bug | Feature | Task}, then create the fully-populated, fully-synced item.
    expansion: >-
      REPORT DIRECTIVE — ISSUE (§11.4.202). The remainder of this prompt is a
      GENERIC REPORT of something trackable. It MUST be turned into a real,
      fully-populated workable item — never merely acknowledged, never silently
      dropped. FIRST classify it into the §11.4.16 CLOSED type set — `Bug` (product
      defect / regression / user-visible broken behaviour), `Feature` (a new
      end-user capability), or `Task` (internal workstream — refactor / doc / infra
      / gate / audit). There is NO fourth type and NO "issue" type: inventing one is
      a §11.4.16 violation. Classify from the report's own content, stated as FACT
      (§11.4.6 — never a guess). If the content does NOT determine the type, ASK the
      operator which of the three it is (§11.4.66 / §11.4.105) BEFORE creating the
      item. If — and only if — running autonomously where asking is impossible
      (§11.4.101), create it with the §11.4.16 lowest-stakes ambiguity default
      `Task`, record the literal `Classification: defaulted-to-Task (§11.4.16
      ambiguity default — reclassify)` inside the item's description, and surface
      the reclassification command to the operator; NEVER silently assert a type the
      report does not support. THEN create it through the project's reporting engine
      (`constitution/scripts/reporting/report_item.sh --kind issue --type
      <Bug|Feature|Task> --title <t> --report <text>`), which creates the item in the
      workable-items SQLite single-source-of-truth (§11.4.93 / §11.4.95 / §11.4.54)
      with the §11.4.148 / §11.4.171 comprehensive structured description, then
      regenerates EVERY derived document from the DB (§11.4.12 / §11.4.53 / §11.4.65
      / §11.4.106) and pushes to EVERY configured external tracker (§11.4.148 D5) —
      SKIPPING with an honest reason any tracker whose credentials / client are
      absent (§11.4.10 / §11.4.6 / §11.4.3), NEVER faking a push. Report back the
      assigned ticket id + the chosen type + the sync verdict + each tracker's
      verdict with its captured-evidence path (§11.4.5 / §11.4.69).
    rules:
      - "The expansion REPLACES the 'ISSUE' prefix in ANY of its forms ('ISSUE: ', 'ISSUE :: ', 'ISSUE ---> ', '/ISSUE ', '/DEFAULT::ISSUE '); the remainder is the report text."
      - "Type MUST come from the §11.4.16 CLOSED set {Bug | Feature | Task}. 'Issue' is a REPORTING channel, NOT a type — never create a 4th type."
      - "Classification is evidence-based (§11.4.6): determinable ⇒ state it; ambiguous ⇒ ASK (§11.4.66 / §11.4.105); autonomous-and-ambiguous ⇒ documented `Task` default + an explicit reclassify note (never a silent assertion)."
      - "The item MUST be created before any other response (§11.4.202 / §11.4.197)."
      - "NEVER fake a tracker push — honest SKIP-with-reason when credentials / client are absent (§11.4.10 / §11.4.6)."
    composes_with:
      - "11.4.202"
      - "11.4.93"
      - "11.4.95"
      - "11.4.15"
