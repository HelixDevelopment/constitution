  # ── Jev decision-layer triggers (§11.4.281(D); data change, never code) ────
  - name: JEV_BOOTSTRAP
    version: 1
    namespaces: [DEFAULT]
    slash_bare: auto
    slash_conflicts: []
    summary: >-
      Run the Jev decision-layer bootstrap wizard: detect decision models,
      provision llmctl + claude_toolkit, wire every detected agent, start
      shadow calibration (§11.4.279–§11.4.286).
    expansion: >-
      Execute the Jev decision-layer bootstrap wizard non-interactively:
      `bash constitution/scripts/jev/bootstrap.sh --non-interactive`
      (fall back to `bash scripts/jev/bootstrap.sh --non-interactive` when the
      constitution is the project root). The wizard runs detect → provision
      (llmctl + claude_toolkit) → detect decision models → install per-agent
      artifacts → configure → shadow-calibrate → verify, reporting progress at
      every stage. If the wizard fails, its own `--defer` fallback records a
      pending stamp; surface the failure per §11.4.6 — never claim bootstrap
      done without the stamp.
    rules:
      - "Non-interactive in agent context only; interactive prompting is for human operators at a TTY (§11.4.281(B))."
      - "A bootstrap claim requires the bootstrap stamp evidence; failure degrades to --defer, never silent skip."
    composes_with:
      - "11.4.279"
      - "11.4.280"
      - "11.4.281"
      - "11.4.286"

  - name: JEV_STATUS
    version: 1
    namespaces: [DEFAULT]
    slash_bare: auto
    slash_conflicts: []
    summary: >-
      Show decision-layer status: detected endpoints, per-agent wiring, mode
      (shadow/enforce), calibrated thresholds, pending bootstrap stamp, and the
      jev-stats savings summary.
    expansion: >-
      Report decision-layer status by running
      `bash scripts/jev/jev-status.sh` (or `bash
      constitution/scripts/jev/jev-status.sh` from a consumer root): detected
      endpoints from jev-detection.json, per-agent wiring state, current mode
      (shadow/enforce), jev-thresholds.json calibration state, any pending
      bootstrap stamp, and jev-stats savings figures — the savings figures are
      ESTIMATES unless they cite the measured §11.4.141 harness. Report the
      output verbatim-relevant parts; never invent status not present in the
      evidence files (§11.4.6).
    rules:
      - "Status claims come from evidence files only (jev-detection.json, thresholds, stamps) — never from assumption (§7.1)."
      - "Savings figures are labeled ESTIMATES unless measured-harness-backed (§11.4.283(C))."
    composes_with:
      - "11.4.279"
      - "11.4.283"
      - "11.4.285"

  - name: CONSTITUTION
    version: 1
    namespaces: [DEFAULT]
    slash_bare: auto
    slash_conflicts: []
    summary: >-
      Constitution command family: status, update (check only), doctor,
      anchors N, gates, report/issue/bug/task/feature, skills, extensions,
      jev, release-notes, help - one read-mostly engine, allow-listed arguments.
    expansion: >-
      Run the constitution command engine with the user's arguments, quoting
      them as ONE argument: `bash submodules/constitution/scripts/constitution_cmd/constitution_cmd.sh
      "<arguments>"` (use `bash constitution/scripts/constitution_cmd/constitution_cmd.sh` for the
      legacy layout, or `bash scripts/constitution_cmd/constitution_cmd.sh` when the constitution
      is the project root). Subcommands: status, update, doctor, anchors N, gates,
      report|issue|bug|task|feature, skills, extensions, jev, release-notes, help. With no
      arguments run `help`. Relay the engine output; never invent status it did not print
      (section 11.4.6). The engine rejects unknown subcommands (exit 2) and reports a missing
      delegated tool as unavailable (exit 3) - relay that honestly, do not work around it.
    rules:
      - "Pass the arguments as a single quoted argument; never build a shell command from user text (section 11.4.287 hygiene)."
      - "update only ever checks; applying an update is a deliberate operator act through update_constitution.sh."
    composes_with:
      - "11.4.140"
      - "11.4.202"
      - "11.4.228"
      - "11.4.272"

# ── Sub-system / submodule shortcuts (§11.4.140 extension, 2026-07-14) ────────
# A grammar-shaped UPPERCASE token that is NOT a registered behavioral action
# (BACKGROUND / REMINDER above) MAY name an incorporated SUB-SYSTEM / submodule.
# Such a token expands to a SUB-SYSTEM CONTEXT injection (repository + org +
# where-checked-out + §11.4.28 equal-codebase / decoupling / dependency-layout +
# §11.4.37 fetch-first + §11.4.113 no-force-push + §11.4.183 full-constitution +
# §11.4/§11.4.69 anti-bluff), then the remainder of the prompt is the task on
# that sub-system. Resolution uses the SAME §11.4.140 grammar (all 5 forms,
# first-non-blank-line anchor, `\`-escape) — the ONLY difference from an action
# is the resolved `kind` field ("subsystem" vs "action"). A behavioral ACTION
# always wins a token collision (the resolver drops action-colliding tokens).
#
# TWO data sources feed the resolver (scripts/action_prefix_lib.sh
# apx_lookup_subsystem, python3+PyYAML):
#   (a) this `subsystems:` NAMED catalogue — curated Helix-ecosystem sub-systems
#       + human abbreviations (HXOTA, HXQA, …); classified universal (§11.4.17):
#       these are the Helix org's OWN products, NOT any single consumer project's
#       assets, so they carry no project-coupling (§11.4.28) — the ATMOSphere-
#       specific submodules (presenter / lampa / torrserve / …) are NEVER listed
#       here; they are covered ONLY by source (b).
#   (b) RECURSIVE .gitmodules discovery from the INVOKING project's root — EVERY
#       submodule anywhere in the graph auto-derives alias tokens (uppercase
#       name / snake / camel-split / abbreviation). A newly-added submodule is
#       covered out-of-box with NO edit to this file. Duplicate checkouts of the
#       same submodule (same canonical URL) collapse to ONE sub-system; an
#       ambiguous token (>1 sub-system) is DROPPED → falls to ASK (§11.4.6).
#
# Each entry: `name` (display, canonical token derived by uppercasing) + `url`
# (canonicalized to merge with any local checkout of the same repo) + optional
# `org` + optional `aliases` (extra UPPERCASE tokens: abbreviation / snake).
# The canonical form-name token, its camelCase-split snake form, and every
# listed alias all resolve to the same sub-system (unless ambiguous/action-coll).
subsystems:
  - name: HelixOTA
    org: HelixDevelopment
    url: git@github.com:HelixDevelopment/HelixOTA.git
    aliases: [HXOTA]
  - name: HelixTrack
    org: Helix-Track
    url: git@github.com:Helix-Track/HelixTrack.git
    aliases: [HXTRACK]
  - name: HelixQA
    org: HelixDevelopment
    url: git@github.com:HelixDevelopment/HelixQA.git
    aliases: [HXQA]
  - name: HelixCode
    org: HelixDevelopment
    url: git@github.com:HelixDevelopment/HelixCode.git
    aliases: [HXCODE]
  - name: HelixAgent
    org: HelixDevelopment
    url: git@github.com:HelixDevelopment/HelixAgent.git
    aliases: [HXAGENT]
  - name: HelixLLM
    org: HelixDevelopment
    url: git@github.com:HelixDevelopment/HelixLLM.git
    aliases: [HXLLM]
  - name: HelixMemory
    org: HelixDevelopment
    url: git@github.com:HelixDevelopment/HelixMemory.git
    aliases: [HXMEM]
  - name: HelixSpecifier
    org: HelixDevelopment
    url: git@github.com:HelixDevelopment/HelixSpecifier.git
    aliases: [HXSPEC]
  - name: LLMsVerifier
    org: vasic-digital
    url: git@github.com:vasic-digital/LLMsVerifier.git
    aliases: [LLMSVERIFIER]
